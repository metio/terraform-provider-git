name: Automated Release
on:
  schedule:
    - cron: 47 2 * * FRI
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit_count: ${{ steps.commits.outputs.count }}
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: commits
        name: Count Commits
        run: echo "count=$(git rev-list --count HEAD --since='last week')" >> "$GITHUB_OUTPUT"
      - id: release
        name: Create Release Version
        if: steps.commits.outputs.count > 0
        run: echo "version=$(date +'%Y.%-m.%-d')" >> "$GITHUB_OUTPUT"
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    if: needs.prepare.outputs.commit_count > 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: 386
          - goos: freebsd
            goarch: arm
          - goos: freebsd
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: 386
          - goos: windows
            goarch: arm
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm
          - goos: darwin
            goarch: arm64
    env:
      VERSION: ${{ needs.prepare.outputs.release_version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        name: Set up Toolchain
        uses: metio/ci/breto@bfcb1a4d37c4fd4d5d9c27181191dcad0d04f90c # main
        with:
          registries: github:metio/toolchains
      - id: build
        name: Build Provider
        run: |
          binary="terraform-provider-git_v${VERSION}"
          if [ "$GOOS" = windows ]; then binary="$binary.exe"; fi
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA}" -o "$binary"
          zip "terraform-provider-git_${VERSION}_${GOOS}_${GOARCH}.zip" "$binary" LICENSE README.md
        env:
          CGO_ENABLED: 0
      - id: upload
        name: Upload Archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-provider-git-${{ matrix.goos }}-${{ matrix.goarch }}
          path: terraform-provider-git_${{ needs.prepare.outputs.release_version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
  release:
    name: GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.release_version }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: download
        name: Download Archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: terraform-provider-git-*
          merge-multiple: true
      - id: checksums
        name: Calculate Checksums
        run: |
          cp terraform-registry-manifest.json "dist/terraform-provider-git_${VERSION}_manifest.json"
          cd dist
          sha256sum -- *.zip "terraform-provider-git_${VERSION}_manifest.json" > "terraform-provider-git_${VERSION}_SHA256SUMS"
      # The Terraform Registry only accepts a GPG signature of the checksums.
      - id: sign
        name: Sign Checksums
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir --mode=700 "$GNUPGHOME"
          printf '%s' "$GPG_SECRET_KEY_BASE64" | base64 --decode | gpg --batch --import
          printf '%s' "$GPG_SECRET_KEY_PASSWORD" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --output "dist/terraform-provider-git_${VERSION}_SHA256SUMS.sig" --detach-sign "dist/terraform-provider-git_${VERSION}_SHA256SUMS"
        env:
          GPG_SECRET_KEY_BASE64: ${{ secrets.GPG_SECRET_KEY_BASE64 }}
          GPG_SECRET_KEY_PASSWORD: ${{ secrets.GPG_SECRET_KEY_PASSWORD }}
      - id: create_release
        name: Create Release
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
      - id: mail
        name: Send Mail
        uses: dawidd6/action-send-mail@47af4a10b540781705f283a2cf1a9650713ac795 # v23
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ github.event.repository.name }} version ${{ needs.prepare.outputs.release_version }} published
          body: See https://github.com/metio/terraform-provider-git/releases/tag/${{ needs.prepare.outputs.release_version }} for details.
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: ${{ secrets.MAIL_SENDER }}
      - id: matrix
        name: Send Matrix Message
        uses: s3krit/matrix-message-action@70ad3fb812ee0e45ff8999d6af11cafad11a6ecf # v0.0.3
        with:
          room_id: ${{ secrets.MATRIX_ROOM_ID }}
          access_token: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          message: ${{ github.event.repository.name }} version [${{ needs.prepare.outputs.release_version }}](https://github.com/metio/terraform-provider-git/releases/tag/${{ needs.prepare.outputs.release_version }}) published
          server: ${{ secrets.MATRIX_SERVER }}
